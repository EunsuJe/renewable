<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신재생에너지 검토 툴</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
         background:#f4f6f9; color:#1f2937; font-size:14px; }
  header { background:#1e3a5f; color:#fff; padding:14px 20px; }
  header h1 { margin:0; font-size:18px; display:inline-block; }
  header span { font-size:12px; opacity:.8; margin-left:10px; }
  .wrap { display:grid; grid-template-columns:360px 1fr; gap:16px; padding:16px; align-items:start; }
  .card { background:#fff; border-radius:8px; padding:16px; margin-bottom:14px;
          box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size:14px; margin:0 0 12px; padding-bottom:8px;
             border-bottom:2px solid #1e3a5f; color:#1e3a5f; }
  label { display:block; font-size:12px; color:#4b5563; margin:8px 0 3px; }
  input, select, textarea { width:100%; padding:7px 8px; border:1px solid #d1d5db;
             border-radius:4px; font-size:13px; font-family:inherit; }
  textarea { resize:vertical; min-height:64px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .chk { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .chk input { width:auto; }
  button { width:100%; padding:12px; background:#1e3a5f; color:#fff; border:none;
           border-radius:5px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:hover { background:#2c5282; }
  #report { min-height:200px; }
  .alert { border-radius:6px; padding:12px 14px; margin-bottom:12px; font-size:13px; }
  .alert.error { background:#fef2f2; border-left:4px solid #dc2626; color:#991b1b; }
  .alert.warn  { background:#fffbeb; border-left:4px solid #d97706; color:#92400e; }
  .alert.info  { background:#eff6ff; border-left:4px solid #2563eb; color:#1e40af; }
  .alert.ok    { background:#f0fdf4; border-left:4px solid #16a34a; color:#166534; }
  .alert b { display:block; margin-bottom:4px; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin:8px 0 16px; }
  th, td { border:1px solid #e5e7eb; padding:7px 9px; text-align:left; }
  th { background:#f3f4f6; font-weight:600; width:200px; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  h3 { font-size:13px; color:#1e3a5f; margin:18px 0 6px; }
  .muted { color:#6b7280; font-size:12px; }
</style>
</head>
<body>

<header><h1>신재생에너지 검토 툴</h1><span id="ver"></span></header>

<div class="wrap">
  <!-- ===== 입력 ===== -->
  <form id="form" onsubmit="return false;">

    <div class="card">
      <h2>STEP 0. 기초정보</h2>
      <label>프로젝트명</label>
      <input id="pjtName" value="OO빌딩 리모델링">

      <div class="row2">
        <div>
          <label>인허가 신청 예정일</label>
          <input type="date" id="permitDate" value="2026-11-15">
        </div>
        <div>
          <label>설치계획서 접수일</label>
          <input type="date" id="planDate">
        </div>
      </div>

      <label>발주자 유형</label>
      <select id="clientType">
        <option value="private">민간</option>
        <option value="public">공공</option>
      </select>

      <label>행위 유형</label>
      <select id="actType">
        <option>신축</option><option>재축</option><option>개축</option>
        <option>별동증축</option><option>수평증축</option>
        <option selected>전면 대수선(리모델링)</option>
      </select>

      <div class="row2">
        <div>
          <label>시·도</label>
          <select id="sido">
            <option>서울특별시</option><option>부산광역시</option><option>대구광역시</option>
            <option>인천광역시</option><option>광주광역시</option><option>대전광역시</option>
            <option>울산광역시</option><option>세종특별자치시</option><option>경기도</option>
            <option>강원특별자치도</option><option>충청북도</option><option>충청남도</option>
            <option>전북특별자치도</option><option>전라남도</option><option>경상북도</option>
            <option>경상남도</option><option>제주특별자치도</option>
          </select>
        </div>
        <div>
          <label>시·군·구</label>
          <input id="sigungu" list="sigunguHint" value="강서구" placeholder="예: 강서구, 고양시">
          <datalist id="sigunguHint">
            <option>고양시</option><option>강릉시</option><option>동해시</option>
            <option>삼척시</option><option>속초시</option><option>고성군</option>
            <option>양양군</option>
          </datalist>
        </div>
      </div>
      <div class="muted" id="localHint" style="margin-top:6px;"></div>
    </div>

    <div class="card">
      <h2>STEP 3. 규모·용도</h2>
      <div class="row2">
        <div><label>총 연면적(㎡)</label><input id="totalArea" value="11360.2"></div>
        <div><label>주차장 면적(㎡)</label><input id="parkingArea" value="0"></div>
      </div>
      <label>세대수(주거)</label>
      <input id="households" value="0">

      <label>용도 구성 (용도,부문,면적 / 줄바꿈)</label>
      <textarea id="useMix">방송통신시설,공공용,11360.2</textarea>
      <div class="muted">부문 생략 가능. 틀리면 표1 기준으로 자동 보정됩니다.</div>

      <div class="row2">
        <div><label>연간 전력(kWh)</label><input id="annualElec" value="24500000"></div>
        <div><label>연간 연료(toe)</label><input id="annualFuel" value="1850"></div>
      </div>
      <label>1차에너지소요량(kWh/㎡yr, ZEB용·선택)</label>
      <input id="primaryEnergy" value="0">
    </div>

    <div class="card">
      <h2>STEP 7. 부지 여건</h2>
      <div class="row2">
        <div><label>옥상 가용(㎡)</label><input id="roofArea" value="1450"></div>
        <div><label>지하개발(㎡)</label><input id="basementArea" value="14000"></div>
      </div>
      <div class="row2">
        <div><label>남측 입면(㎡)</label><input id="facadeS" value="2200"></div>
        <div><label>동/서 입면(㎡)</label><input id="facadeEW" value="2200"></div>
      </div>
      <div class="chk"><input type="checkbox" id="geoOk"><label for="geoOk">지열 가능</label></div>
      <div class="chk"><input type="checkbox" id="gasOk" checked><label for="gasOk">가스 인입 충분</label></div>
      <div class="chk"><input type="checkbox" id="hydroOk"><label for="hydroOk">수열 수원 확보</label></div>
      <div class="chk"><input type="checkbox" id="zebCert"><label for="zebCert">ZEB 인증 취득 예정</label></div>
    </div>

    <div class="card">
      <h2>심의 반영값 (override)</h2>
      <label>신재생 목표 비율(%) — 0이면 미적용</label>
      <input id="ovRatio" value="0">
      <label>사유</label>
      <input id="ovReason" value="심의위원 의견">
      <div style="margin-top:14px;"><button id="run">검토 실행</button></div>
    </div>
  </form>

  <!-- ===== 결과 ===== -->
  <div id="report" class="card"><span class="muted">좌측 입력 후 [검토 실행]을 눌러주세요.</span></div>
</div>

<script type="module" src="./engine.js?v=20260819"></script>
</body>
</html>
